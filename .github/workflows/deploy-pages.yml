name: Deploy to GitHub Pages

# NOTE: Automatic deploys are turned OFF for now.
# GitHub Pages must first be enabled (Settings -> Pages -> Source:
# "GitHub Actions") and, on a free plan, the repository must be public.
# Once that's done, re-enable automatic deploys by uncommenting the
# "push" trigger below — or just run this workflow manually from the
# Actions tab ("Run workflow").
on:
  # push:
  #   branches: ["claude/tender-cori-ierkl9"]
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it doesn't exist yet
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repository (it's a plain static site)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
